<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abono</title>
<meta name="apple-mobile-web-app-title" content="Abono">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6e8ec">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#e6e8ec;font-family:-apple-system,system-ui,sans-serif;color:#1b2550}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;background:#e6e8ec}
  .pick{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
  .pick img{width:96px;height:96px;border-radius:22px}
  .pick a{display:block;width:220px;padding:14px;border-radius:12px;background:#1b2550;color:#fff;text-decoration:none;font-weight:600}
  .tip{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#1b2550;color:#fff;border-radius:14px;padding:12px 40px 12px 14px;font-size:14px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:2}
  .tip b{color:#e3b33a}
  .tip button{position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:20px;padding:4px 8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="pick" id="pick" hidden>
  <img src="icono-180.png" alt="">
  <h1 style="margin:0;font-size:22px">Libro del Abono</h1>
  <p style="margin:0;color:#646a82">¿Quién eres?</p>
  <a href="?yo=p1">Gonzalo</a><a href="?yo=p2">Manuel</a><a href="?yo=p3">Pedro</a>
</div>
<div class="tip" id="tip" hidden>Para tenerla como app: pulsa <b>Compartir</b> (el cuadrado con la flecha) y luego <b>Añadir a pantalla de inicio</b>.<button type="button" id="tipX" aria-label="Cerrar">×</button></div>
<script>
  var APP = "https://script.google.com/macros/s/AKfycbxHWzGWJC5xwHakNP-iwxpqdHjFcDLmCBB0RrNirJ9Quu4ugf4Pc9bEbXRhNzGyvs-i/exec";
  var ok = ["p1", "p2", "p3"];
  var yo = new URLSearchParams(location.search).get("yo");
  try { if (ok.indexOf(yo) >= 0) localStorage.setItem("abono-yo", yo); else yo = localStorage.getItem("abono-yo"); } catch (e) {}
  if (ok.indexOf(yo) >= 0) {
    var f = document.createElement("iframe");
    f.src = APP + "?yo=" + yo;
    f.title = "Libro del Abono";
    f.allow = "clipboard-write";
    document.body.appendChild(f);
    var app = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    if (ios && !app) document.getElementById("tip").hidden = false;
    document.getElementById("tipX").onclick = function () { document.getElementById("tip").hidden = true; };
  } else {
    document.getElementById("pick").hidden = false;
  }
</script>
</body>
</html>
