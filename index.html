<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abono</title>
<meta name="apple-mobile-web-app-title" content="Abono">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6e8ec">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;min-height:100%;background:#e6e8ec;font-family:-apple-system,system-ui,sans-serif;color:#1b2550}
  .pick{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
  .pick img{width:96px;height:96px;border-radius:22px}
  .pick a,.pick button{display:block;width:220px;padding:14px;border-radius:12px;background:#1b2550;color:#fff;text-decoration:none;font:600 16px -apple-system,system-ui,sans-serif;border:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="pick">
  <img src="icono-180.png" alt="">
  <h1 style="margin:0;font-size:22px">Libro del Abono</h1>
  <div id="cargando"><p style="margin:0;color:#646a82">Cargando…</p></div>
  <div id="elige" hidden><p style="margin:0 0 12px;color:#646a82">¿Quién eres?</p>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center"><a href="?yo=p1">Gonzalo</a><a href="?yo=p2">Manuel</a><a href="?yo=p3">Pedro</a></div></div>
  <div id="instala" hidden>
    <p style="margin:0 0 10px;max-width:300px;line-height:1.45">Para tenerla como app: pulsa <b>Compartir</b> (el cuadrado con la flecha) y luego <b>Añadir a pantalla de inicio</b>.</p>
    <button type="button" id="abrir" style="background:#e3b33a;color:#1b2550;margin:0 auto">Abrir ahora</button>
  </div>
  <div id="error" hidden><p style="margin:0 0 10px;color:#b4462f">No se pudo cargar. Revisa la conexión.</p><button type="button" onclick="location.reload()">Reintentar</button></div>
</div>
<script>
(function () {
  var APP = "https://script.google.com/macros/s/AKfycbxHWzGWJC5xwHakNP-iwxpqdHjFcDLmCBB0RrNirJ9Quu4ugf4Pc9bEbXRhNzGyvs-i/exec";
  var OK = ["p1", "p2", "p3"];
  var $ = function (id) { return document.getElementById(id); };
  var quien = new URLSearchParams(location.search).get("yo");
  var guardado = null;
  try { if (OK.indexOf(quien) >= 0) localStorage.setItem("abono-yo", quien); else quien = localStorage.getItem("abono-yo"); } catch (e) {}
  try { guardado = localStorage.getItem("abono-ui"); } catch (e) {}

  var mostrado = false;
  function mostrar(html) {
    if (mostrado) return;
    mostrado = true;
    document.open();
    document.write(html);
    document.close();
  }
  function cargar() {
    if (guardado) mostrar(guardado);
    fetch(APP + "?api=ui", { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        if (html.indexOf("Libro del Abono") < 0) throw new Error("respuesta rara");
        try { localStorage.setItem("abono-ui", html); } catch (e) {}
        mostrar(html);
      })
      .catch(function () { if (!mostrado) { $("cargando").hidden = true; $("error").hidden = false; } });
  }

  if (OK.indexOf(quien) < 0) { $("cargando").hidden = true; $("elige").hidden = false; return; }
  var esApp = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios && !esApp) {
    $("cargando").hidden = true;
    $("instala").hidden = false;
    $("abrir").onclick = cargar;
    return;
  }
  cargar();
})();
</script>
</body>
</html>
